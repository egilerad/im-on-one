<!doctype html><script type="module">
try{
const {createEngine}=await import('../audio.mjs');
async function render(v){const c=new OfflineAudioContext(2,22050*5,22050),e=createEngine(c,0);e.commit({a:null,b:null,gain:.1,walk:0,side:0,people:0,metal:0,...v},0);for(let t=.025;t<5;t+=.025)e.tick(t);const b=await c.startRendering();e.dispose();return b.getChannelData(0);}
const energy=x=>x.reduce((s,v)=>s+v*v,0),difference=(a,b)=>energy(a.map((x,i)=>x-b[i]));
const empty=await render({metal:1});if(energy(empty)>1e-9)throw Error('aura created sound from nothing');
const plain=await render({a:110}),metal=await render({a:110,metal:1});if(difference(plain,metal)<.01)throw Error('aura does not affect continuous sound');
const foot=await render({walk:1}),metalFoot=await render({walk:1,metal:1});if(difference(foot,metalFoot)<.001)throw Error('aura does not affect movement');
const one=await render({metal:1,strike:.4,place:0}),two=await render({metal:1,strike:.4,place:1});if(difference(one,two)>1e-7)throw Error('strike still localized by place');
let peak=0;for(const x of metalFoot){if(!Number.isFinite(x))throw Error('nonfinite');peak=Math.max(peak,Math.abs(x));}if(peak>=.9)throw Error('unsafe fixture');
window.auraResults={pass:true,peak,toneDifference:difference(plain,metal),movementDifference:difference(foot,metalFoot)};
}catch(e){window.auraResults={pass:false,error:e.message};}
</script>

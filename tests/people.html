<!doctype html><script type="module">
try{const {createEngine}=await import('../audio.mjs');const rows=[];for(const people of [0,1,3,8]){const rate=22050,c=new OfflineAudioContext(2,rate*12,rate),e=createEngine(c,0);e.update({a:null,b:null,gain:0,walk:0,side:0,metal:0,people,linger:3},0);for(let t=.025;t<12;t+=.025)e.tick(t);const b=await c.startRendering();let en=0,peak=0,jump=0;for(const x of [b.getChannelData(0),b.getChannelData(1)])for(let i=1;i<x.length;i++){en+=x[i]*x[i];peak=Math.max(peak,Math.abs(x[i]));jump=Math.max(jump,Math.abs(x[i]-x[i-1]));}rows.push({people,rms:Math.sqrt(en/(rate*24)),peak,jump});e.dispose();}if(rows[0].peak!==0)throw Error('zero not silent');if(rows[1].rms<.001)throw Error('one visitor too faint '+JSON.stringify(rows[1]));if(rows.some(r=>r.peak>.15||r.jump>.008))throw Error('harsh visitors '+JSON.stringify(rows));window.peopleResults={pass:true,rows};}catch(e){window.peopleResults={pass:false,error:e.message};}
</script>

<!doctype html><script type="module">
try{const {createEngine}=await import('../audio.mjs');async function run(side){const c=new OfflineAudioContext(2,22050*10,22050),e=createEngine(c,0);e.update({a:null,b:null,gain:0,walk:.5,side,metal:0,people:0,linger:3},0);for(let t=.025;t<10;t+=.025)e.tick(t);const b=await c.startRendering();let peak=0,jump=0,en=0;for(const x of [b.getChannelData(0),b.getChannelData(1)])for(let i=1;i<x.length;i++){peak=Math.max(peak,Math.abs(x[i]));jump=Math.max(jump,Math.abs(x[i]-x[i-1]));en+=x[i]*x[i];}return {peak,jump,en};}const centre=await run(0),wall=await run(-.9);if(centre.peak>.08||centre.jump>.004)throw Error('harsh pulse '+JSON.stringify(centre));if(Math.abs(wall.en/centre.en-1)<.2)throw Error('weak wall interaction');window.pulseResults={pass:true,centre,wall};}catch(e){window.pulseResults={pass:false,error:e.message};}
</script>

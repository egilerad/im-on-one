<!doctype html><meta charset="utf-8"><pre id="result">running</pre><script type="module">
const rate = 22050;
const base = {a: 110, b: 110.5, gain: .12, walk: 0, side: 0, metal: 0, people: 0, linger: 4};
async function render(values, seconds, changes = []) {
  const {createEngine} = await import('../audio.mjs');
  const ctx = new OfflineAudioContext(2, rate * seconds, rate), e = createEngine(ctx, 0);
  e.update(values, 0);
  const generation = e.generation;
  for (let t = .025; t < seconds; t += .025) {
    for (const c of changes) if (Math.abs(c.time - t) < .0125) e.update({...values, ...c.values}, t);
    e.tick(t);
  }
  if (e.generation !== generation) throw Error('graph restarted');
  const buffer = await ctx.startRendering(), snapshot = e.snapshot(seconds);
  e.dispose();
  const left = buffer.getChannelData(0), right = buffer.getChannelData(1);
  let peak = 0;
  for (const x of [...left, ...right]) { if (!Number.isFinite(x)) throw Error('non-finite audio'); peak = Math.max(peak, Math.abs(x)); }
  return {left, right, peak, snapshot};
}
const energy = (x, from = 0, to = x.length / rate) => { let sum = 0; for (let i = Math.floor(from * rate); i < Math.floor(to * rate); i++) sum += x[i] * x[i]; return sum; };
const bright = (x, from, to) => { let d = 0, e = 0; for (let i = Math.floor(from * rate) + 1; i < Math.floor(to * rate); i++) { d += (x[i] - x[i - 1]) ** 2; e += x[i] * x[i]; } return d / (e || 1e-12); };
const results = {};
try {
  const zero = {a: null, b: null, gain: .12, walk: 0, side: 0, metal: 0, people: 0, linger: .2};
  // the zero point is silent
  const nothing = await render(zero, 3);
  results.zero = energy(nothing.left) + energy(nothing.right);
  if (!(results.zero < 1e-8)) throw Error('the zero point is not silent');

  // a lone sine is only a steady tone: no beating, no footsteps (measured after the walls have faded in)
  const lone = await render({...zero, a: 110}, 6);
  const steady = [3.5, 4, 4.5, 5].map(t => energy(lone.left, t, t + .08));
  results.lone = steady;
  if (Math.max(...steady) > Math.min(...steady) * 1.3) throw Error('a lone sine pulsed');

  // a voice entering from silence starts at its own pitch (no glide from an old one)
  const enter = await render(zero, 2.5, [{time: 1.5, values: {a: 220}}]);
  let crossings = 0; for (let i = Math.floor(1.6 * rate); i < Math.floor(2.1 * rate); i++) if (enter.left[i - 1] < 0 && enter.left[i] >= 0) crossings++;
  results.enter = crossings / .5;
  if (Math.abs(results.enter - 220) > 12) throw Error('entering voice glided: ' + results.enter);

  // the walls come with the sines: footsteps in the open have no wall reflections
  const open = await render({...zero, walk: 1}, 8), walled = await render({...zero, walk: 1, a: 110, gain: 0}, 8);
  results.openWalled = [energy(open.left), energy(walled.left)];
  if (!(energy(walled.left) > 1.2 * energy(open.left))) throw Error('walls did not arrive with the sine');

  // all elements together stay finite and bounded
  const all = await render({...base, walk: 1, metal: .7, people: 3}, 12);
  if (all.peak >= 1 || energy(all.left) < .01) throw Error('invalid full output ' + all.peak);
  results.peak = all.peak;

  // the two wall tones beat
  const tones = await render(base, 4);
  const windows = [.5, 1, 1.5].map(t => energy(tones.left, t, t + .08));
  if (Math.max(...windows) < Math.min(...windows) * 3) throw Error('pair did not beat');
  results.windows = windows;

  // walking makes footsteps; standing still does not
  const still = await render({...base, gain: 0}, 8), walking = await render({...base, gain: 0, walk: 1}, 8);
  results.steps = [energy(still.left), energy(walking.left)];
  if (!(energy(walking.left) > 1e-3 && energy(walking.left) > 50 * energy(still.left))) throw Error('no footsteps');

  // passing judd units rings metal
  const metal = await render({...base, gain: 0, walk: 1, metal: 1}, 8);
  results.metal = energy(metal.left);
  if (!(energy(metal.left) > 2 * energy(walking.left))) throw Error('units did not ring');

  // other people are audible even when the performer stands still
  const people = await render({...base, gain: 0, people: 4}, 10);
  results.people = energy(people.left);
  if (!(energy(people.left) > 1e-4)) throw Error('people silent');

  // nearer the outer wall versus the inner wall changes the reflected stereo image
  const outer = await render({...base, gain: 0, walk: .8, side: -1}, 10), inner = await render({...base, gain: 0, walk: .8, side: 1}, 10);
  const ratio = x => energy(x.left, 3, 10) / energy(x.right, 3, 10);
  results.walls = [ratio(outer), ratio(inner)];
  if (Math.abs(Math.log(ratio(outer) / ratio(inner))) < .1) throw Error('walls did not change the image');

  // the longest linger stays stable (feedback never grows)
  const long = await render({...base, metal: .8, linger: 20, people: 1}, 20);
  results.stable = [energy(long.left, 4, 6), energy(long.left, 18, 20)];
  if (!(results.stable[1] < results.stable[0] * 1.5)) throw Error('feedback grew');

  // going deeper darkens the tones consistently: compare with standing still at the entrance (same window, no footsteps)
  const deep = await render({...base, metal: .8}, 40, [{time: 4, values: {walk: 2}}, {time: 30, values: {walk: 0}}]);
  const entrance = await render({...base, metal: .8}, 40);
  results.bright = [bright(entrance.left, 36, 39), bright(deep.left, 36, 39)];
  results.deepStable = [energy(deep.left, 31, 33), energy(deep.left, 37, 39)];
  if (results.deepStable[1] > results.deepStable[0] * 1.2) throw Error('feedback grew deep inside');
  if (!(results.bright[1] < results.bright[0] * .7)) throw Error('sound did not dampen with depth');
  if (!(deep.snapshot.damp > .5)) throw Error('damping state did not accumulate');

  // update keeps the oscillators and their phase
  const updated = await render(base, 3, [{time: 1.5, values: {a: 130, b: 130.5, walk: .5}}]);
  if (updated.snapshot.a < 129) throw Error('update not applied');
  results.pass = true;
} catch (e) { results.pass = false; results.error = e.message; }
window.audioResults = results;
document.getElementById('result').textContent = JSON.stringify(results);
</script>

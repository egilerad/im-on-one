<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>i'm on one</title>
<meta name="description" content="i'm on one: a livecoding walk through a torqued steel spiral.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<img id="image" alt="" hidden>
<video id="video" muted loop playsinline preload="auto" aria-hidden="true" hidden></video>
<canvas id="visual" aria-label="overhead plan: a torqued spiral wall, metal units, a walking body, other people and reflections"></canvas>
<section class="score">
<div class="editor">
<textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="score" aria-invalid="false" autofocus></textarea>
<div class="mirror" aria-hidden="true"></div>
</div>
</section>
<p id="announce" class="sr" role="status" aria-live="polite"></p>
<script type="module" src="app.mjs"></script>
</body>
</html>
